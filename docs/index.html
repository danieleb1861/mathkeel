<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore the mathkeel chain view with zoom and pan. A synthetic demonstration fixture.">
  <title>mathkeel · Chain view</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: #f5f3ed; color: #202c33; font: 16px/1.5 system-ui, sans-serif; }
    header { padding: 16px 24px; border-bottom: 1px solid #c8cdc8; }
    h1 { font-size: 20px; margin: 0; }
    p { margin: 6px 0 12px; font-size: 14px; }
    a { color: #185b69; }
    nav { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    button { min-height: 44px; padding: 8px 16px; font: inherit; border: 1px solid #899b9c; border-radius: 6px; background: white; color: inherit; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    :focus-visible { outline: 3px solid #007c91; outline-offset: 2px; }
    output { min-width: 58px; font-variant-numeric: tabular-nums; }
    nav a { margin-left: auto; }
    #viewer { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; cursor: grab; background: #e4e8e5; }
    #viewer.dragging { cursor: grabbing; }
    img { display: block; width: 100%; max-width: none; height: auto; user-select: none; }
    #error { padding: 12px 24px; }
    @media (max-width: 500px) { header { padding: 12px; } nav a { margin-left: 0; } }
  </style>
</head>
<body>
  <header>
    <h1>mathkeel / Chain view</h1>
    <p>Synthetic fixture. Zoom with the buttons, then drag or scroll to explore. This is an image viewer; chart nodes are not interactive.</p>
    <nav aria-label="Figure controls">
      <button id="out" type="button" aria-label="Zoom out" disabled>−</button>
      <output id="scale" aria-live="polite">100%</output>
      <button id="in" type="button" aria-label="Zoom in">+</button>
      <button id="fit" type="button">Fit width</button>
      <a href="https://github.com/danieleb1861/mathkeel#readme">Back to repository</a>
    </nav>
  </header>
  <p id="error" role="alert" hidden>The image could not load. <a href="https://github.com/danieleb1861/mathkeel/blob/main/packages/ui/screenshots/chain-day-desktop.png">Open the original on GitHub.</a></p>
  <main id="viewer" tabindex="0" aria-label="Chain figure. Use arrow keys to scroll, plus and minus to zoom, or zero to fit width.">
    <img id="figure" src="https://raw.githubusercontent.com/danieleb1861/mathkeel/main/packages/ui/screenshots/chain-day-desktop.png" alt="mathkeel chain view showing documented mathematical statements and their connections" draggable="false">
  </main>
  <script>
    const viewer = document.getElementById('viewer');
    const figure = document.getElementById('figure');
    const label = document.getElementById('scale');
    const zoomIn = document.getElementById('in');
    const zoomOut = document.getElementById('out');
    let scale = 1;
    let drag = null;

    function zoom(next) {
      const width = figure.clientWidth;
      if (!width) return;
      const x = (viewer.scrollLeft + viewer.clientWidth / 2) / width;
      const y = (viewer.scrollTop + viewer.clientHeight / 2) / width;
      scale = Math.max(1, Math.min(8, next));
      figure.style.width = `${scale * 100}%`;
      viewer.scrollLeft = x * figure.clientWidth - viewer.clientWidth / 2;
      viewer.scrollTop = y * figure.clientWidth - viewer.clientHeight / 2;
      label.textContent = `${Math.round(scale * 100)}%`;
      zoomOut.disabled = scale === 1;
      zoomIn.disabled = scale === 8;
    }
    function fit() {
      zoom(1);
      viewer.scrollTo(0, 0);
    }
    zoomIn.addEventListener('click', () => zoom(scale * 1.25));
    zoomOut.addEventListener('click', () => zoom(scale / 1.25));
    document.getElementById('fit').addEventListener('click', fit);
    viewer.addEventListener('keydown', (event) => {
      if (event.ctrlKey || event.metaKey || event.altKey) return;
      if (['+', '=', '-', '0'].includes(event.key)) {
        event.preventDefault();
        if (event.key === '0') fit();
        else zoom(scale * (event.key === '-' ? 0.8 : 1.25));
      }
    });
    viewer.addEventListener('pointerdown', (event) => {
      if (event.pointerType !== 'mouse' || event.button !== 0) return;
      drag = { x: event.clientX, y: event.clientY, left: viewer.scrollLeft, top: viewer.scrollTop };
      viewer.setPointerCapture(event.pointerId);
      viewer.classList.add('dragging');
    });
    viewer.addEventListener('pointermove', (event) => {
      if (!drag) return;
      viewer.scrollLeft = drag.left + drag.x - event.clientX;
      viewer.scrollTop = drag.top + drag.y - event.clientY;
    });
    viewer.addEventListener('lostpointercapture', () => {
      drag = null;
      viewer.classList.remove('dragging');
    });
    figure.addEventListener('error', () => { document.getElementById('error').hidden = false; });
    if (figure.complete && !figure.naturalWidth) document.getElementById('error').hidden = false;
  </script>
</body>
</html>
